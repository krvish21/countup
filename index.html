<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabaa & Vish · Together since July 3, 2024</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff4f1;--bg2:#f6dfe6;--ink:#3a1f2b;--muted:#8a6573;--card:rgba(255,255,255,.65);
  --line:rgba(214,60,103,.18);--accent:#d63c67;--accent2:#b07d2b;--track:rgba(214,60,103,.15);
  --shadow:0 20px 50px -20px rgba(150,40,80,.35);color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#1a0f1a;--bg2:#2b1426;--ink:#fbeaf0;--muted:#c4a0b0;--card:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.12);--accent:#ff7b9c;--accent2:#f2c77a;--track:rgba(255,255,255,.12);
    --shadow:0 20px 50px -20px #000;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#1a0f1a;--bg2:#2b1426;--ink:#fbeaf0;--muted:#c4a0b0;--card:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.12);--accent:#ff7b9c;--accent2:#f2c77a;--track:rgba(255,255,255,.12);
  --shadow:0 20px 50px -20px #000;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:Inter,system-ui,sans-serif;
  background:radial-gradient(60% 40% at 80% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent),
             linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;display:flex;justify-content:center;overflow-x:hidden;
}
.wrap{width:100%;max-width:520px;padding:28px 18px 40px;position:relative;z-index:1}
.theme{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
header{text-align:center;padding-top:18px}
.eyebrow{margin:0;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
h1{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(2.3rem,10vw,3.2rem);margin:.2em 0 .1em;line-height:1.1}
h1 i{color:var(--accent);font-weight:400}
.since{margin:0;color:var(--accent2);font-family:'Playfair Display',serif;font-style:italic}
.greet{margin:18px 0 0;text-align:center;padding:12px 16px;border-radius:16px;border:1px solid var(--line);
  background:var(--card);font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.hero{text-align:center;margin:26px 0 8px}
.big{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(4.5rem,24vw,7.5rem);line-height:1;
  font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.big-label{letter-spacing:.25em;text-transform:uppercase;font-size:.8rem;color:var(--muted);margin-top:4px}
.ymd{margin:12px 0 0;font-family:'Playfair Display',serif;font-size:1.15rem}
.card{border:1px solid var(--line);background:var(--card);border-radius:20px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.clock{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.clock div{padding:14px 6px;text-align:center}
.clock b{display:block;font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}
.clock span,.stat span{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.next{padding:16px}
.next .row{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;margin-bottom:10px}
.next .row b{color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.stat{padding:14px;text-align:center}
.stat b{display:block;font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.stat:last-child{grid-column:1/3}
.heart{position:fixed;bottom:-40px;color:var(--accent);opacity:.18;pointer-events:none;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.heart,.confetti{display:none}}
</style>
</head>
<body>
<main class="wrap">
  <button id="theme" class="theme" aria-label="Toggle theme">☾</button>
  <header>
    <p class="eyebrow">Together since</p>
    <h1>Sabaa <i>&</i> Vish</h1>
    <p class="since">July 3, 2024 · 7:58 AM</p>
  </header>
  <div id="greet" class="greet" hidden></div>
  <section class="hero">
    <div class="big" id="days">0</div>
    <div class="big-label">days together</div>
    <p class="ymd" id="ymd"></p>
  </section>
  <section class="clock">
    <div class="card"><b id="h">0</b><span>Hours</span></div>
    <div class="card"><b id="m">0</b><span>Minutes</span></div>
    <div class="card"><b id="s">0</b><span>Seconds</span></div>
  </section>
  <section class="next card">
    <div class="row"><span>Next milestone: <b id="nName"></b></span><span id="nIn"></span></div>
    <div class="bar"><i id="fill"></i></div>
  </section>
  <section class="stats" id="stats"></section>
</main>
<script>
const START = new Date(2024, 6, 3, 7, 58, 0);
const MILES = [100,200,300,365,500,730,1000,1095,1460,1500,1825,2000,2500,3000,3650,4000,5000];
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString();
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds());
const mName = m => m % 365 === 0 ? plural(m / 365, 'year') : fmt(m) + ' days';

const STATS = [['months','Months'],['weeks','Weeks'],['hours','Hours'],['minutes','Minutes'],['seconds','Seconds']];
$('stats').innerHTML = STATS.map(([k, l]) => `<div class="card stat"><span>${l}</span><b id="st-${k}">0</b></div>`).join('');

let confettiDone = false;
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div');
  box.className = 'confetti';
  const cols = ['#ffeb3b', '#e14d72', '#6dd5ed', '#4caf50', '#ff9ec0'];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement('i');
    const sz = Math.random() * 8 + 6;
    p.style.cssText = `left:${Math.random() * 100}vw;width:${sz}px;height:${sz * 1.4}px;background:${cols[i % cols.length]};` +
      `animation-duration:${Math.random() * 2 + 3}s;animation-delay:${Math.random() * 1.5}s`;
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 8000);
}

function tick() {
  const now = new Date();
  const dist = now - START;
  const days = Math.floor(dist / 864e5);
  const rem = dist % 864e5;
  let mo = (now.getFullYear() - START.getFullYear()) * 12 + now.getMonth() - START.getMonth();
  if (addMonths(START, mo) > now) mo--;
  const anchor = addMonths(START, mo);
  const dd = Math.floor((now - anchor) / 864e5);

  $('days').textContent = fmt(days);
  $('h').textContent = Math.floor(rem / 36e5);
  $('m').textContent = Math.floor(rem % 36e5 / 6e4);
  $('s').textContent = Math.floor(rem % 6e4 / 1e3);
  $('ymd').textContent = [plural(Math.floor(mo / 12), 'year'), plural(mo % 12, 'month'), plural(dd, 'day')].join(' · ');

  const next = MILES.find(m => m > days) || Math.ceil((days + 1) / 1000) * 1000;
  const prev = [0, ...MILES].filter(m => m <= days).pop();
  $('nName').textContent = mName(next);
  $('nIn').textContent = 'in ' + plural(next - days, 'day');
  $('fill').style.width = ((days - prev) / (next - prev) * 100) + '%';

  const tot = { months: mo, weeks: Math.floor(days / 7), hours: Math.floor(dist / 36e5), minutes: Math.floor(dist / 6e4), seconds: Math.floor(dist / 1e3) };
  for (const k in tot) $('st-' + k).textContent = fmt(tot[k]);

  const g = $('greet');
  if (mo > 0 && anchor.toDateString() === now.toDateString()) {
    g.hidden = false;
    g.textContent = '🎉 ' + (mo % 12 === 0 ? 'Happy ' + plural(mo / 12, 'year') + ' together!' : 'Happy ' + mo + ' months!') + ' 🎉';
    if (!confettiDone) { confettiDone = true; confetti(); }
  } else g.hidden = true;
}
$('greet').addEventListener('click', confetti);
tick();
setInterval(tick, 1000);
document.addEventListener('visibilitychange', tick);

for (let i = 0; i < 12; i++) {
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = '♥';
  h.style.cssText = `left:${Math.random() * 100}vw;font-size:${Math.random() * 18 + 12}px;animation-duration:${Math.random() * 14 + 16}s;animation-delay:${-Math.random() * 20}s`;
  document.body.appendChild(h);
}

const root = document.documentElement, tbtn = $('theme');
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const paint = () => tbtn.textContent = isDark() ? '☀' : '☾';
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch (e) {}
paint();
tbtn.addEventListener('click', () => {
  root.dataset.theme = isDark() ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
  paint();
});
</script>
</body>
</html>
